version: '3'
services:
  simulation:
    image: tortoisebot-gazebo
    container_name: tortoisebot-gazebo
    # init: true
    environment:
      - DISPLAY=${DISPLAY}
      - LIBGL_ALWAYS_SOFTWARE=1
      - ROS_MASTER_URI=http://simulation:11311 
      - ROS_HOSTNAME=simulation 
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ~/.gazebo:/root/.gazebo
